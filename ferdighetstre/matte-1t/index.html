<!DOCTYPE html>
<html lang="nb">
<head>
  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ferdighetstre — Matematikk 1T</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="../style.css">
  <script src="/js/analytics.js"></script>
  <script src="/js/theme.js" defer></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      </button>
      <a class="back-link" href="../">← alle ferdighetstrær</a>
      <h1>Ferdighetstre for Matematikk 1T</h1>
      <p class="tagline">Et kart over hvordan ferdigheter og begreper bygger på hverandre — huk av det du mestrer, og kopier en KI-instruks for å trene videre.</p>
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
        <span class="progress-label" id="progress-label">0 av 0 ferdigheter fullført</span>
      </div>
    </div>
  </header>

  <div id="error-banner"></div>
  <div id="legend"></div>

  <main>
    <div id="graph-scroll">
      <div id="graph-container">
        <div id="column-bands"></div>
        <svg id="edges"></svg>
        <div id="column-headers"></div>
        <div id="nodes-layer"></div>
      </div>
    </div>

    <aside id="detail-panel">
      <div id="detail-panel-inner">
        <p id="detail-empty">Klikk på en node i kartet for å se detaljer.</p>
      </div>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="config.js"></script>
  <script src="../engine.js"></script>
</body>
</html>
